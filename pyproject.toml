[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Give your AI agent hands to shape the internet — not just eyes to read it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AgentForge Team" },
]
keywords = ["ai", "agent", "automation", "cli", "platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "feedparser>=6.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "schedule>=1.2",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
agentforge = "agentforge.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]
